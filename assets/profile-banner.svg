<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Abstract profile banner</title>
  <desc id="desc">A calm blue, violet, and coral gradient with soft geometric shapes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.48" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="0.52" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.82"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>

  <ellipse cx="210" cy="70" rx="240" ry="150" fill="#0ea5e9" fill-opacity="0.22" filter="url(#blur)"/>
  <ellipse cx="1010" cy="255" rx="270" ry="155" fill="#f43f5e" fill-opacity="0.2" filter="url(#blur)"/>
  <ellipse cx="650" cy="160" rx="310" ry="190" fill="url(#glow)" filter="url(#blur)"/>

  <path d="M-80 260C145 105 318 83 488 166s352 95 792-111" fill="none" stroke="url(#ribbon)" stroke-width="5" stroke-linecap="round"/>
  <path d="M-80 282C145 127 318 105 488 188s352 95 792-111" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" stroke-linecap="round"/>

  <circle cx="104" cy="88" r="5" fill="#ffffff" fill-opacity="0.82"/>
  <circle cx="1074" cy="102" r="4" fill="#ffffff" fill-opacity="0.68"/>
  <circle cx="1122" cy="69" r="2.5" fill="#ffffff" fill-opacity="0.52"/>
  <circle cx="966" cy="58" r="2" fill="#ffffff" fill-opacity="0.45"/>
</svg>
